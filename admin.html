<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administration — Auto-Connect Teranga</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<style>
  :root{
    --bg:#0e1319; --panel:#171e27; --panel2:#1e2733; --border:#2a3542;
    --text:#eef1f4; --muted:#9aa7b4; --gold:#e7ac46; --green:#399478;
    --red:#c9524a; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Manrope,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 20px;}
  .top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--border); background:var(--panel);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700;}
  .brand small{display:block; font-weight:400; color:var(--muted); font-size:12px;}
  .top-right{display:flex; align-items:center; gap:12px; font-size:14px; color:var(--muted);}
  .btn{
    border:none; border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:transform .12s, opacity .12s;
  }
  .btn:active{transform:scale(.97);}
  .btn-gold{background:var(--gold); color:#1a140a;}
  .btn-outline{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-outline:hover{border-color:var(--gold);}
  .btn-danger{background:transparent; color:var(--red); border:1px solid rgba(201,82,74,.4);}
  .btn-danger:hover{background:rgba(201,82,74,.12);}
  .btn-sm{padding:7px 13px; font-size:13px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---------- login ---------- */
  #loginView{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:32px 28px;
  }
  .login-card h1{font-size:20px; margin:0 0 4px;}
  .login-card p{color:var(--muted); font-size:14px; margin:0 0 24px;}
  label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px;}
  input[type=text], input[type=email], input[type=password], input[type=number], select, textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    padding:11px 12px; color:var(--text); font-size:15px; font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--gold);}
  .error-msg{
    background:rgba(201,82,74,.12); border:1px solid rgba(201,82,74,.35); color:#f2a39d;
    border-radius:8px; padding:10px 12px; font-size:13px; margin-top:14px; display:none;
  }
  .error-msg.show{display:block;}
  .login-card button{width:100%; margin-top:20px; justify-content:center;}

  /* ---------- dashboard ---------- */
  #dashboardView{display:none;}
  .toolbar{display:flex; align-items:center; justify-content:space-between; padding:24px 0 16px; gap:12px; flex-wrap:wrap;}
  .toolbar h2{margin:0; font-size:18px;}
  .toolbar .count{color:var(--muted); font-size:13px; font-weight:400;}

  .vgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:16px; padding-bottom:60px;}
  .vcard-admin{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column;
  }
  .vcard-admin .thumb{
    aspect-ratio:4/3; background:var(--panel2) center/cover no-repeat; position:relative;
  }
  .vcard-admin .badge{
    position:absolute; top:8px; left:8px; font-size:11px; font-weight:700; padding:4px 9px;
    border-radius:999px; color:#0c0f08;
  }
  .badge.sale{background:var(--gold);}
  .badge.rent{background:var(--green); color:#fff;}
  .vcard-admin .body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .vcard-admin h3{font-size:15px; margin:0;}
  .vcard-admin .meta{font-size:12.5px; color:var(--muted);}
  .vcard-admin .price{font-size:14px; font-weight:700; color:var(--gold);}
  .vcard-admin .row-btns{display:flex; gap:8px; margin-top:auto; padding-top:10px;}
  .vcard-admin .row-btns .btn{flex:1; justify-content:center;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted); border:1px dashed var(--border);
    border-radius:var(--radius);
  }

  /* ---------- modal form ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,7,10,.72); display:none;
    align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    width:100%; max-width:640px; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:26px 26px 30px;
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .modal-head h2{margin:0; font-size:18px;}
  .modal-close{background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media (max-width:560px){ .field-row, .field-row3{grid-template-columns:1fr;} }
  fieldset{border:none; padding:0; margin:18px 0 0;}
  .radio-group{display:flex; gap:16px; margin-top:8px;}
  .radio-group label{display:flex; align-items:center; gap:6px; color:var(--text); font-size:14px; margin:0;}
  .radio-group input{width:auto;}

  .photo-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(90px,1fr)); gap:8px; margin-top:10px;}
  .photo-item{position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--panel2);}
  .photo-item img, .photo-item video{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-item .rm{
    position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; border:none;
    background:rgba(10,12,16,.75); color:#fff; font-size:13px; cursor:pointer; line-height:1;
  }
  .photo-item .uploading{
    position:absolute; inset:0; background:rgba(10,12,16,.6); display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-size:11px; text-align:center; padding:4px;
  }
  .upload-zone{
    margin-top:10px; border:1.5px dashed var(--border); border-radius:10px; padding:18px;
    text-align:center; color:var(--muted); font-size:13px; cursor:pointer;
  }
  .upload-zone:hover{border-color:var(--gold); color:var(--text);}
  .upload-zone input{display:none;}

  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:26px;}
  .form-error{
    background:rgba(201,82,74,.12); border:1px solid rgba(201,82,74,.35); color:#f2a39d;
    border-radius:8px; padding:10px 12px; font-size:13px; margin-top:16px; display:none;
  }
  .form-error.show{display:block;}
  .hint{font-size:12px; color:var(--muted); margin-top:4px;}

  .spinner{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2);
    border:1px solid var(--border); color:var(--text); padding:12px 20px; border-radius:999px;
    font-size:14px; z-index:80; box-shadow:0 10px 30px rgba(0,0,0,.4); display:none;
  }
  .toast.show{display:block;}
  .toast.error{border-color:rgba(201,82,74,.5); color:#f2a39d;}

  #gateLoading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted);}
</style>
</head>
<body>

<div id="gateLoading">Chargement…</div>

<div id="loginView" style="display:none">
  <div class="login-card">
    <h1>Administration</h1>
    <p>Auto-Connect Teranga — connexion réservée à l'équipe.</p>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
      <label for="loginPassword">Mot de passe</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
      <div class="error-msg" id="loginError"></div>
      <button type="submit" class="btn btn-gold" id="loginSubmit">Se connecter</button>
    </form>
  </div>
</div>

<div id="dashboardView">
  <div class="top">
    <div class="brand">
      <span>🚗 Auto-Connect Teranga</span>
    </div>
    <div class="top-right">
      <span id="whoami"></span>
      <button class="btn btn-outline btn-sm" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <h2>Véhicules <span class="count" id="vCount"></span></h2>
      <button class="btn btn-gold" id="addBtn">+ Ajouter un véhicule</button>
    </div>
    <div id="listArea"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Ajouter un véhicule</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <form id="vehicleForm">
      <input type="hidden" id="fId">

      <label for="fName">Nom du véhicule</label>
      <input type="text" id="fName" required placeholder="ex: Toyota Land Cruiser Prado TXL">

      <div class="field-row">
        <div>
          <label for="fBrand">Marque</label>
          <input type="text" id="fBrand" required placeholder="ex: Toyota">
        </div>
        <div>
          <label for="fType">Catégorie</label>
          <select id="fType">
            <option value="sedan">Berline</option>
            <option value="crossover">Crossover</option>
            <option value="luxury-sedan">Berline de luxe</option>
            <option value="boxy-suv">Gros SUV</option>
            <option value="pickup-suv">Pick-up / SUV</option>
          </select>
        </div>
      </div>

      <fieldset>
        <label style="margin:0">Mode</label>
        <div class="radio-group">
          <label><input type="radio" name="fMode" value="vente" checked> À vendre</label>
          <label><input type="radio" name="fMode" value="location"> À louer</label>
        </div>
      </fieldset>

      <div class="field-row3">
        <div>
          <label for="fYear">Année</label>
          <input type="text" id="fYear" placeholder="ex: 2020 ou –">
        </div>
        <div>
          <label for="fGearbox">Boîte</label>
          <select id="fGearbox">
            <option value="Automatique">Automatique</option>
            <option value="Manuelle">Manuelle</option>
            <option value="–">Non précisé</option>
          </select>
        </div>
        <div>
          <label for="fSeats">Places</label>
          <input type="number" id="fSeats" min="1" max="20" value="5">
        </div>
      </div>

      <div class="field-row">
        <div>
          <label for="fFuel">Carburant</label>
          <select id="fFuel">
            <option value="Essence">Essence</option>
            <option value="Diesel">Diesel</option>
            <option value="Essence (Hybride)">Essence (Hybride)</option>
            <option value="–">Non précisé</option>
          </select>
        </div>
        <div>
          <label for="fColorName">Couleur</label>
          <input type="text" id="fColorName" placeholder="ex: Blanc">
        </div>
      </div>

      <label for="fNote">Description / équipements</label>
      <textarea id="fNote" rows="2" placeholder="ex: 130 000 km · Caméra de recul · Climatisation bizone"></textarea>
      <p class="hint">Séparez les éléments par « · ». Pour un véhicule en location, vous pouvez mettre par ex. « Location min. 48h ».</p>

      <div class="field-row">
        <div>
          <label for="fPrice">Prix (laissez vide si « sur demande »)</label>
          <input type="text" id="fPrice" placeholder="ex: 12,5">
        </div>
        <div>
          <label for="fUnit">Unité</label>
          <input type="text" id="fUnit" placeholder="ex: M FCFA" value="M FCFA">
        </div>
      </div>

      <label>Photos &amp; vidéos</label>
      <div class="photo-grid" id="photoGrid"></div>
      <label class="upload-zone" id="uploadZone">
        <span id="uploadZoneLabel">Cliquez ou déposez des photos / vidéos ici</span>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple>
      </label>
      <p class="hint" id="photoHint">Au moins 1 photo est requise.</p>

      <div class="form-error" id="formError"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelBtn">Annuler</button>
        <button type="submit" class="btn btn-gold" id="saveBtn">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/act-config.js"></script>
<script src="assets/act-cloudinary.js"></script>
<script type="module" src="assets/act-firebase.js"></script>
<script type="module">
  var FB = window.ACT_FB;
  var auth = FB.auth, db = FB.db;

  function slugify(name){
    return name.normalize('NFKD').replace(/[̀-ͯ]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  // ---------- gate / auth ----------
  var gateLoading = document.getElementById('gateLoading');
  var loginView = document.getElementById('loginView');
  var dashboardView = document.getElementById('dashboardView');
  var whoami = document.getElementById('whoami');

  FB.onAuthStateChanged(auth, function(user){
    gateLoading.style.display = 'none';
    if(user && window.ACT_CONFIG.adminEmails.indexOf(user.email) !== -1){
      loginView.style.display = 'none';
      dashboardView.style.display = 'block';
      whoami.textContent = user.email;
      loadVehicles();
    } else if(user){
      // Compte authentifié mais pas autorisé : on déconnecte immédiatement.
      FB.signOut(auth);
      loginView.style.display = 'flex';
      dashboardView.style.display = 'none';
      showLoginError('Ce compte n\'a pas accès au tableau de bord.');
    } else {
      loginView.style.display = 'flex';
      dashboardView.style.display = 'none';
    }
  });

  var loginForm = document.getElementById('loginForm');
  var loginError = document.getElementById('loginError');
  function showLoginError(msg){
    loginError.textContent = msg;
    loginError.classList.add('show');
  }
  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    loginError.classList.remove('show');
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var btn = document.getElementById('loginSubmit');
    btn.disabled = true;
    btn.textContent = 'Connexion…';
    FB.signInWithEmailAndPassword(auth, email, password).catch(function(err){
      var msg = 'Email ou mot de passe incorrect.';
      if(err && err.code === 'auth/too-many-requests') msg = 'Trop de tentatives, réessayez dans un instant.';
      showLoginError(msg);
    }).finally(function(){
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    FB.signOut(auth);
  });

  // ---------- toast ----------
  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(msg, isError){
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.className = 'toast'; }, 3500);
  }

  // ---------- list ----------
  var listArea = document.getElementById('listArea');
  var vCount = document.getElementById('vCount');
  var currentVehicles = [];

  function loadVehicles(){
    listArea.innerHTML = '<p style="color:var(--muted)">Chargement des véhicules…</p>';
    var q = FB.query(FB.collection(db, 'vehicles'), FB.orderBy('createdAt', 'asc'));
    FB.getDocs(q).then(function(snap){
      currentVehicles = snap.docs.map(function(d){
        var v = d.data();
        v._id = d.id;
        return v;
      });
      renderList();
    }).catch(function(err){
      listArea.innerHTML = '<div class="empty-state">Impossible de charger les véhicules.<br>' + (err && err.message ? err.message : '') + '</div>';
    });
  }

  function renderList(){
    vCount.textContent = '(' + currentVehicles.length + ')';
    if(!currentVehicles.length){
      listArea.innerHTML = '<div class="empty-state">Aucun véhicule pour l\'instant. Cliquez sur « + Ajouter un véhicule ».</div>';
      return;
    }
    var html = '<div class="vgrid">';
    currentVehicles.forEach(function(v){
      var thumb = (v.photos && v.photos[0]) ? window.ACT_cldThumb(v.photos[0], 400) : '';
      var badgeClass = v.mode === 'vente' ? 'sale' : 'rent';
      var badgeLabel = v.mode === 'vente' ? 'À vendre' : 'À louer';
      html += '' +
        '<div class="vcard-admin" data-id="' + v._id + '">' +
          '<div class="thumb" style="' + (thumb ? 'background-image:url(\'' + thumb + '\')' : '') + '">' +
            '<span class="badge ' + badgeClass + '">' + badgeLabel + '</span>' +
          '</div>' +
          '<div class="body">' +
            '<h3>' + escapeHtml(v.name || '') + '</h3>' +
            '<div class="meta">' + escapeHtml(v.brand || '') + ' · ' + escapeHtml(v.year || '') + '</div>' +
            (v.price ? '<div class="price">' + escapeHtml(v.price) + ' ' + escapeHtml(v.unit || '') + '</div>' : '<div class="meta">Prix sur demande</div>') +
            '<div class="row-btns">' +
              '<button class="btn btn-outline btn-sm edit-btn">Modifier</button>' +
              '<button class="btn btn-danger btn-sm del-btn">Supprimer</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    });
    html += '</div>';
    listArea.innerHTML = html;

    listArea.querySelectorAll('.edit-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.closest('.vcard-admin').getAttribute('data-id');
        var v = currentVehicles.find(function(x){ return x._id === id; });
        if(v) openForm(v);
      });
    });
    listArea.querySelectorAll('.del-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.closest('.vcard-admin').getAttribute('data-id');
        var v = currentVehicles.find(function(x){ return x._id === id; });
        if(!v) return;
        if(!confirm('Supprimer définitivement « ' + v.name + ' » ? Cette action est irréversible.')) return;
        FB.deleteDoc(FB.doc(db, 'vehicles', id)).then(function(){
          toast('Véhicule supprimé.');
          loadVehicles();
        }).catch(function(err){
          toast('Erreur : ' + err.message, true);
        });
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ---------- form / modal ----------
  var modalOverlay = document.getElementById('modalOverlay');
  var modalTitle = document.getElementById('modalTitle');
  var vehicleForm = document.getElementById('vehicleForm');
  var formError = document.getElementById('formError');
  var photoGrid = document.getElementById('photoGrid');
  var currentPhotos = []; // { url, type: 'image'|'video' }
  var editingId = null;

  function openForm(v){
    formError.classList.remove('show');
    editingId = v ? v._id : null;
    modalTitle.textContent = v ? 'Modifier le véhicule' : 'Ajouter un véhicule';
    document.getElementById('fId').value = editingId || '';
    document.getElementById('fName').value = v ? v.name || '' : '';
    document.getElementById('fBrand').value = v ? v.brand || '' : '';
    document.getElementById('fType').value = v ? v.type || 'sedan' : 'sedan';
    document.querySelectorAll('input[name=fMode]').forEach(function(r){ r.checked = (r.value === (v ? v.mode : 'vente')); });
    document.getElementById('fYear').value = v ? v.year || '' : '';
    document.getElementById('fGearbox').value = v ? v.gearbox || 'Automatique' : 'Automatique';
    document.getElementById('fSeats').value = v ? v.seats || 5 : 5;
    document.getElementById('fFuel').value = v ? v.fuel || 'Essence' : 'Essence';
    document.getElementById('fColorName').value = v ? v.colorName || '' : '';
    document.getElementById('fNote').value = v ? v.note || '' : '';
    document.getElementById('fPrice').value = v ? v.price || '' : '';
    document.getElementById('fUnit').value = v ? (v.unit || 'M FCFA') : 'M FCFA';

    currentPhotos = [];
    if(v && v.photos){ v.photos.forEach(function(u){ currentPhotos.push({ url: u, type: 'image' }); }); }
    if(v && v.videos){ v.videos.forEach(function(u){ currentPhotos.push({ url: u, type: 'video' }); }); }
    renderPhotoGrid();

    modalOverlay.classList.add('show');
  }

  function closeForm(){
    modalOverlay.classList.remove('show');
  }
  document.getElementById('addBtn').addEventListener('click', function(){ openForm(null); });
  document.getElementById('modalClose').addEventListener('click', closeForm);
  document.getElementById('cancelBtn').addEventListener('click', closeForm);
  modalOverlay.addEventListener('click', function(e){ if(e.target === modalOverlay) closeForm(); });

  function renderPhotoGrid(){
    photoGrid.innerHTML = '';
    currentPhotos.forEach(function(p, i){
      var item = document.createElement('div');
      item.className = 'photo-item';
      if(p.type === 'video'){
        item.innerHTML = '<video src="' + p.url + '" muted></video>';
      } else {
        item.innerHTML = '<img src="' + window.ACT_cldThumb(p.url, 200) + '" alt="">';
      }
      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'rm';
      rm.textContent = '✕';
      rm.addEventListener('click', function(){
        currentPhotos.splice(i, 1);
        renderPhotoGrid();
      });
      item.appendChild(rm);
      photoGrid.appendChild(item);
    });
  }

  var uploadZone = document.getElementById('uploadZone');
  var fileInput = document.getElementById('fileInput');
  uploadZone.addEventListener('dragover', function(e){ e.preventDefault(); });
  uploadZone.addEventListener('drop', function(e){
    e.preventDefault();
    if(e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', function(){
    if(fileInput.files.length) handleFiles(fileInput.files);
    fileInput.value = '';
  });

  function handleFiles(fileList){
    Array.prototype.slice.call(fileList).forEach(function(file){
      var isVideo = file.type.indexOf('video') === 0;
      var placeholderIndex = currentPhotos.length;
      currentPhotos.push({ url: '', type: isVideo ? 'video' : 'image', uploading: true });
      renderUploadingPlaceholder(placeholderIndex, file);
      window.ACT_cldUpload(file).then(function(res){
        currentPhotos[placeholderIndex] = { url: res.url, type: res.resourceType };
        renderPhotoGrid();
      }).catch(function(err){
        currentPhotos.splice(placeholderIndex, 1);
        renderPhotoGrid();
        toast('Échec de l\'upload : ' + err.message, true);
      });
    });
  }

  function renderUploadingPlaceholder(index, file){
    renderPhotoGrid();
    // Ajoute un overlay "en cours" sur le dernier item ajouté.
    var items = photoGrid.children;
    var item = items[index];
    if(!item) return;
    item.innerHTML = '<div class="uploading"><span class="spinner"></span></div>';
  }

  document.getElementById('vehicleForm').addEventListener('submit', function(e){
    e.preventDefault();
    formError.classList.remove('show');

    if(currentPhotos.some(function(p){ return p.uploading; })){
      formError.textContent = 'Merci d\'attendre la fin de l\'upload des photos.';
      formError.classList.add('show');
      return;
    }
    var photos = currentPhotos.filter(function(p){ return p.type === 'image'; }).map(function(p){ return p.url; });
    var videos = currentPhotos.filter(function(p){ return p.type === 'video'; }).map(function(p){ return p.url; });
    if(!photos.length){
      formError.textContent = 'Ajoutez au moins une photo.';
      formError.classList.add('show');
      return;
    }

    var name = document.getElementById('fName').value.trim();
    var brand = document.getElementById('fBrand').value.trim();
    if(!name || !brand){
      formError.textContent = 'Le nom et la marque sont obligatoires.';
      formError.classList.add('show');
      return;
    }

    var mode = document.querySelector('input[name=fMode]:checked').value;
    var data = {
      name: name,
      brand: brand,
      type: document.getElementById('fType').value,
      mode: mode,
      year: document.getElementById('fYear').value.trim() || '–',
      gearbox: document.getElementById('fGearbox').value,
      seats: parseInt(document.getElementById('fSeats').value, 10) || 5,
      fuel: document.getElementById('fFuel').value,
      colorName: document.getElementById('fColorName').value.trim() || '–',
      color: '#9aa5b1',
      note: document.getElementById('fNote').value.trim(),
      price: document.getElementById('fPrice').value.trim(),
      unit: document.getElementById('fUnit').value.trim(),
      photos: photos,
      videos: videos,
      updatedAt: FB.serverTimestamp()
    };

    var saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner"></span> Enregistrement…';

    var savePromise;
    if(editingId){
      savePromise = FB.updateDoc(FB.doc(db, 'vehicles', editingId), data);
    } else {
      data.slug = uniqueSlug(name);
      data.createdAt = FB.serverTimestamp();
      savePromise = FB.addDoc(FB.collection(db, 'vehicles'), data);
    }

    savePromise.then(function(){
      toast(editingId ? 'Véhicule mis à jour.' : 'Véhicule ajouté.');
      closeForm();
      loadVehicles();
    }).catch(function(err){
      formError.textContent = 'Erreur : ' + err.message;
      formError.classList.add('show');
    }).finally(function(){
      saveBtn.disabled = false;
      saveBtn.textContent = 'Enregistrer';
    });
  });

  function uniqueSlug(name){
    var base = slugify(name);
    var existing = currentVehicles.map(function(v){ return v.slug; });
    var slug = base, n = 2;
    while(existing.indexOf(slug) !== -1){
      slug = base + '-' + n;
      n++;
    }
    return slug;
  }
</script>
</body>
</html>
